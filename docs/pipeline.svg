<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 432" width="1340" height="432" role="img" aria-label="Pipeline: issue, intake, route, spec-writer, builder, gate, reviewers, approver, merge. Gate failures and review changes loop back to the builder as new rounds. Intake can park a job for the author or reject it; the builder, last-round failures, the approver and the merge can all hand the PR to a human, whose feedback starts a new round.">
  <title>Factory pipeline</title>
  <style>
    svg { --bg:#ffffff; --surface:#ffffff; --fg:#1b2230; --muted:#5d6677; --line:#d5dae3;
          --agent-fill:#e6ecff; --agent-stroke:#3d5bd9; --script-stroke:#1b2230;
          --wait-fill:#fff3e3; --wait-stroke:#c26a12; color:#1b2230; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --surface:#161b22; --fg:#e6edf3; --muted:#9198a1; --line:#30363d;
            --agent-fill:#1d2950; --agent-stroke:#8aa2ff; --script-stroke:#e6edf3;
            --wait-fill:#33240f; --wait-stroke:#f0a04b; color:#e6edf3; }
    }
    .bg { fill: var(--bg); }
    .n-agent { fill: var(--agent-fill); stroke: var(--agent-stroke); stroke-width: 1.5; }
    .n-script { fill: var(--surface); stroke: var(--script-stroke); stroke-width: 1.5; }
    .n-wait { fill: var(--wait-fill); stroke: var(--wait-stroke); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .n-plain { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t-name { font-size: 13px; font-weight: 600; fill: var(--fg); }
    .t-edge, .t-wait, .t-loop { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
    .t-sub { font-size: 11px; fill: var(--muted); }
    .t-edge { fill: var(--fg); font-weight: 500; }
    .t-note { font-size: 11px; fill: var(--muted); }
    .t-wait { fill: var(--wait-stroke); font-weight: 500; }
    .t-loop { fill: var(--agent-stroke); font-weight: 500; }
    .t-legend { font-size: 12px; fill: var(--fg); }
    .e { fill: none; stroke: var(--fg); stroke-width: 1.4; }
    .e-loop { fill: none; stroke: var(--agent-stroke); stroke-width: 1.4; }
    .e-wait { fill: none; stroke: var(--wait-stroke); stroke-width: 1.4; stroke-dasharray: 4 3; }
    .ah { fill: var(--fg); } .ah-loop { fill: var(--agent-stroke); } .ah-wait { fill: var(--wait-stroke); }
  </style>
  <rect class="bg" x="0" y="0" width="1340" height="432" rx="10"/>

        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-loop" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-wait" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>

        <!-- Round loops (above the spine) -->
        <text class="t-note" x="812" y="58" text-anchor="middle">each loop starts a new round · max_rounds = 3, then needs-human</text>
        <path class="e-loop" d="M970,172 V96 H654 V170" marker-end="url(#al)"/>
        <text class="t-loop" x="812" y="88" text-anchor="middle">CHANGES → builder reads review-*.md</text>
        <path class="e-loop" d="M820,172 V136 H686 V170" marker-end="url(#al)"/>
        <text class="t-loop" x="753" y="128" text-anchor="middle">FAIL → checks log</text>

        <!-- Spine edges -->
        <g>
          <line class="e" x1="120" y1="200" x2="168" y2="200" marker-end="url(#a)"/>
          <line class="e" x1="270" y1="200" x2="318" y2="200" marker-end="url(#a)"/>
          <line class="e" x1="420" y1="200" x2="468" y2="200" marker-end="url(#a)"/>
          <line class="e" x1="570" y1="200" x2="618" y2="200" marker-end="url(#a)"/>
          <line class="e" x1="720" y1="200" x2="768" y2="200" marker-end="url(#a)"/>
          <line class="e" x1="870" y1="200" x2="918" y2="200" marker-end="url(#a)"/>
          <line class="e" x1="1020" y1="200" x2="1068" y2="200" marker-end="url(#a)"/>
          <line class="e" x1="1170" y1="200" x2="1218" y2="200" marker-end="url(#a)"/>
        </g>
        <g class="t-edge" text-anchor="middle">
          <text x="295" y="192">ACCEPT</text>
          <text x="445" y="192">routed</text>
          <text x="595" y="192">spec.md</text>
          <text x="745" y="192">pushed</text>
          <text x="895" y="192">PASS</text>
          <text x="1045" y="192">all PASS</text>
          <text x="1195" y="192">APPROVE</text>
        </g>

        <!-- Spine nodes -->
        <g text-anchor="middle">
          <rect class="n-plain" x="20" y="172" width="100" height="56" rx="8"/>
          <text class="t-name" x="70" y="196">GitHub issue</text>
          <text class="t-sub" x="70" y="213">label: factory</text>

          <rect class="n-agent" x="170" y="172" width="100" height="56" rx="8"/>
          <text class="t-name" x="220" y="196">intake</text>
          <text class="t-sub" x="220" y="213">fable</text>

          <rect class="n-script" x="320" y="172" width="100" height="56" rx="3"/>
          <text class="t-name" x="370" y="196">route</text>
          <text class="t-sub" x="370" y="213">risk → reviewers</text>

          <rect class="n-agent" x="470" y="172" width="100" height="56" rx="8"/>
          <text class="t-name" x="520" y="196">spec-writer</text>
          <text class="t-sub" x="520" y="213">opus</text>

          <rect class="n-agent" x="620" y="172" width="100" height="56" rx="8"/>
          <text class="t-name" x="670" y="196">builder</text>
          <text class="t-sub" x="670" y="213">opus · draft PR</text>

          <rect class="n-script" x="770" y="172" width="100" height="56" rx="3"/>
          <text class="t-name" x="820" y="196">gate</text>
          <text class="t-sub" x="820" y="213">checks.sh</text>

          <rect class="n-agent" x="920" y="172" width="100" height="56" rx="8"/>
          <text class="t-name" x="970" y="196">reviewers</text>
          <text class="t-sub" x="970" y="213">code +ux/ui/sec</text>

          <rect class="n-agent" x="1070" y="172" width="100" height="56" rx="8"/>
          <text class="t-name" x="1120" y="196">approver</text>
          <text class="t-sub" x="1120" y="213">opus</text>

          <rect class="n-script" x="1220" y="172" width="100" height="56" rx="3"/>
          <text class="t-name" x="1270" y="196">job merge</text>
          <text class="t-sub" x="1270" y="213">re-gate · gh pr</text>
        </g>

        <!-- Intake exits -->
        <path class="e-wait" d="M196,228 V270 H120 V298" marker-end="url(#aw)"/>
        <text class="t-wait" x="190" y="256" text-anchor="end">NEEDS-INFO</text>
        <path class="e" d="M150,330 H222 V230" marker-end="url(#a)"/>
        <text class="t-sub" x="156" y="360">author replies</text>
        <path class="e-wait" d="M250,228 V298" marker-end="url(#aw)"/>
        <text class="t-wait" x="256" y="262">REJECT</text>

        <g text-anchor="middle">
          <rect class="n-wait" x="30" y="300" width="120" height="44" rx="8"/>
          <text class="t-name" x="90" y="320">needs-info</text>
          <text class="t-sub" x="90" y="335">question on issue</text>

          <rect class="n-wait" x="230" y="300" width="100" height="44" rx="8"/>
          <text class="t-name" x="280" y="320">rejected</text>
          <text class="t-sub" x="280" y="335">reason on issue</text>
        </g>

        <!-- Escalations to a human -->
        <g>
          <line class="e-wait" x1="670" y1="228" x2="670" y2="318" marker-end="url(#aw)"/>
          <line class="e-wait" x1="820" y1="228" x2="820" y2="318" marker-end="url(#aw)"/>
          <line class="e-wait" x1="970" y1="228" x2="970" y2="318" marker-end="url(#aw)"/>
          <line class="e-wait" x1="1120" y1="228" x2="1120" y2="318" marker-end="url(#aw)"/>
          <line class="e-wait" x1="1270" y1="228" x2="1270" y2="318" marker-end="url(#aw)"/>
        </g>
        <g class="t-wait">
          <text x="676" y="272">BLOCKED</text>
          <text x="826" y="266">last round</text><text x="826" y="280">FAIL</text>
          <text x="976" y="266">last round</text><text x="976" y="280">CHANGES</text>
          <text x="1126" y="272">ESCALATE</text>
          <text x="1264" y="266" text-anchor="end">conflict or</text><text x="1264" y="280" text-anchor="end">re-gate fails</text>
        </g>

        <rect class="n-wait" x="620" y="320" width="700" height="56" rx="8"/>
        <text class="t-name" x="970" y="344" text-anchor="middle">needs-human</text>
        <text class="t-sub" x="970" y="362" text-anchor="middle">PR marked ready · question posted on the PR · issue labeled factory:needs-human</text>

        <!-- Feedback loop -->
        <path class="e-loop" d="M620,362 H586 V214 H618" marker-end="url(#al)"/>
        <text class="t-loop" x="580" y="290" text-anchor="end">/factory feedback</text>
        <text class="t-loop" x="580" y="304" text-anchor="end">new rounds</text>

  <!-- Legend -->
  <g transform="translate(20 404)">
    <rect class="n-agent" x="0" y="0" width="22" height="14" rx="3"/><text class="t-legend" x="30" y="11">Claude agent (model)</text>
    <rect class="n-script" x="180" y="0" width="22" height="14" rx="2"/><text class="t-legend" x="210" y="11">deterministic script</text>
    <rect class="n-wait" x="350" y="0" width="22" height="14" rx="3"/><text class="t-legend" x="380" y="11">waits on a person</text>
  </g>
</svg>
